name: Test
#https://docs.github.com/ru/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
on: workflow_dispatch
jobs:
  test:
    #где запускаем
    runs-on:
      group: build-runners
      #что делаем
    steps:
      #выкачиваем репозиторий
      - uses: actions/checkout@v7
      #настраиваем джава https://github.com/actions/setup-java
      - uses: actions/setup-java@v6
        #добавляем селеноид чтобы кейсы в гитхаб не падали https://github.com/Xotabu4/selenoid-github-action далее переходим в гредл
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: Xotabu4/selenoid-github-action@v2
      #запуск тестов
      #//для работы с селеноидом в гитхаб добавляем (наийти по selenide remote webdriver(Можно ли использовать Selenide в связке с Selenoid?)) из https://ru.selenide.org/faq.html
      # или под блоком https://github.com/Xotabu4/selenoid-github-action
      - run: ./gradlew clean test -Dselenide.remote=http://localhost:4444/wd/hub
       #gh_pages https://github.com/marketplace/actions/allure-report-with-history
      - uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
        #Example usage (github action)  https://github.com/marketplace/actions/allure-report-with-history
      - uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: build/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
        #Finally you need to publish on GitHub Pages https://github.com/marketplace/actions/allure-report-with-history\
      - uses: peaceiris/actions-gh-pages@v2
        if: always()
        env:
          PERSONAL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_BRANCH: gh-pages
          PUBLISH_DIR: allure-history
        #перед создаением папка гитхаб в консоли: git status потом git add потом git commit -m "initial commit"

      #после заполнения этого документа: git status потом git add потом git commit -m "add simple ci" потом git push origin main
      # после того как запулено на гит  нужно перейти в settings Pages - Deploy from branch, branch - gh-pages + save
      #потом мы сможем в правой панели code в enbiroments  - github-pages-внутри view deployment откроется интернетный алюр